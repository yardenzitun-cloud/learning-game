<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2b2d42">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>הרפתקת הלמידה</title>
<style>
:root{--bg:#f4f1ea;--ink:#2b2d42;--accent:#ff8c42;--accent2:#2a9d8f;--card:#fff;--ok:#2a9d8f;--bad:#e63946;}
body.tamar{--accent:#d63384;--accent2:#7b4fd0;--bg:#fbf0f6;}
body.yonatan{--accent:#ff8c42;--accent2:#2a9d8f;--bg:#eef6f3;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%}
body{font-family:Arial,"Noto Sans Hebrew",sans-serif;background:var(--bg);color:var(--ink);font-size:22px;overflow-x:hidden}
#app{max-width:1100px;margin:0 auto;padding:16px;min-height:100%}
button{font-family:inherit;font-size:inherit;border:0;cursor:pointer;color:inherit}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.topbar .title{font-size:30px;font-weight:bold;flex:1}
.pill{background:var(--card);border-radius:999px;padding:8px 18px;font-weight:bold;box-shadow:0 2px 6px rgba(0,0,0,.08);white-space:nowrap}
.iconbtn{background:var(--card);border-radius:16px;width:62px;height:62px;font-size:30px;box-shadow:0 2px 6px rgba(0,0,0,.1);flex:none}
.big{background:var(--accent);color:#fff;border-radius:20px;padding:18px 30px;font-size:26px;font-weight:bold;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.big.alt{background:var(--accent2)}
.big.gray{background:#8d99ae}
.big:active,.opt:active,.card:active{transform:translateY(2px)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.card{background:var(--card);border-radius:24px;padding:22px;box-shadow:0 3px 10px rgba(0,0,0,.08);text-align:center}
.kidcard{font-size:30px;font-weight:bold;padding:36px 20px}
.kidcard .face{font-size:90px;display:block}
.kidcard small{display:block;font-size:20px;font-weight:normal;opacity:.7;margin-top:6px}
.subj{display:flex;align-items:center;gap:18px;text-align:right}
.subj .ic{font-size:64px}
.subj b{font-size:30px;display:block}
.subj span{font-size:18px;opacity:.7}
.goal{background:var(--card);border-radius:20px;padding:14px 18px;margin:16px 0;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.bar{height:22px;background:#e9ecef;border-radius:999px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:999px;transition:width .5s}
.map{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;padding:10px 0}
.stage{width:150px;background:var(--card);border-radius:24px;padding:14px 8px;box-shadow:0 3px 8px rgba(0,0,0,.08);text-align:center}
.stage .num{width:70px;height:70px;border-radius:50%;margin:0 auto 8px;background:var(--accent);color:#fff;font-size:34px;font-weight:bold;display:flex;align-items:center;justify-content:center}
.stage.locked{opacity:.45}
.stage.locked .num{background:#adb5bd}
.stage .nm{font-size:17px;min-height:42px}
.lesson{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:18px;align-items:center}
.lesson .lt{font-size:28px;line-height:1.6;max-width:820px}
.lesson .lv{font-size:40px;min-height:40px}
.lrow{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.lnum{background:#fff;border:3px solid var(--accent);border-radius:16px;padding:6px 12px;display:flex;flex-direction:column;align-items:center;min-width:70px;cursor:pointer}
.lnum b{font-size:44px}.lnum span{font-size:14px;color:var(--accent2);letter-spacing:1px;max-width:70px;word-break:break-all}
.lbox{border:3px solid #2b2d42;border-radius:10px;min-width:48px;padding:6px;font-size:30px;font-weight:bold;background:#fff}
.lbox.hi{background:#ffe8a3;border-color:var(--accent)}.lbox.big{font-size:26px;padding:12px 18px}
.lbig{font-size:120px;font-weight:bold;line-height:1.1}.lbig small{font-size:70px;opacity:.7}
.lword{font-size:44px;margin:8px;cursor:pointer;background:#fff;border-radius:16px;padding:6px 18px;display:inline-block}.lword .ch{color:var(--accent2);font-size:36px}
.tapw{background:#fff;border:3px solid var(--accent2);border-radius:14px;padding:8px 14px;font-size:32px;font-weight:bold;margin:3px}.tapw.hit{background:#c7f0e3}.tapw.heb{font-size:56px}
.lcap{display:flex;flex-direction:column;align-items:center;font-size:22px}
.lgrp{background:#fff;border:3px dashed var(--accent);border-radius:12px;padding:6px;font-size:30px}
.bondc{width:90px;height:90px;border-radius:50%;border:4px solid #2b2d42;background:#fff;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:bold}.bondc.bw{width:110px;height:110px;font-size:52px}
table.vert{border-collapse:collapse;margin:0 auto;direction:ltr;font-size:40px;font-weight:bold}
table.vert td{width:66px;height:56px;text-align:center;border:1px solid #dee2e6;background:#fff}
table.vert td.h{font-size:15px;font-weight:normal;background:#f1f3f5;height:auto;padding:4px}
table.vert td.c{color:var(--bad);font-size:24px;border:0;background:none}table.vert td.op{border:0;background:none}table.vert td.r{border-top:4px solid #2b2d42;color:var(--accent2)}
.stage{position:relative}.lbadge{position:absolute;top:6px;left:8px;font-size:26px;background:#fff;border-radius:50%;padding:2px}
.toast{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);background:var(--ok);color:#fff;font-size:44px;font-weight:bold;padding:18px 40px;border-radius:24px;z-index:70;animation:pop .3s;pointer-events:none}.toast.bad{background:#adb5bd;font-size:34px}
@media(max-width:600px){.opt.wide{min-width:140px}.opt{min-height:90px;padding:10px 16px}.prompt{font-size:26px}}
.opt.showme,.numbox.showme{outline:6px solid #f4b400;animation:pop .5s infinite alternate}
.hintbox.reveal{background:#e7f8f2;border-color:var(--ok)}
.iconbtn.pulse{animation:pop .6s infinite alternate;outline:4px solid #f4b400}
.dict{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.dcard{background:#fff;border-radius:18px;padding:12px;box-shadow:0 2px 6px rgba(0,0,0,.08);display:flex;flex-direction:column;align-items:center;gap:4px}
.dcard .de{font-size:52px}.dcard b{font-size:28px}.dcard .dh{font-size:20px;color:#495057}.dcard .dh.hid{visibility:hidden}.dcard.hit{outline:3px solid var(--accent2)}
.mascot{position:absolute;width:84px;height:110px;line-height:1;z-index:6;transition:left .45s ease,top .45s ease;filter:drop-shadow(0 5px 3px rgba(0,0,0,.25));cursor:pointer;left:0;top:0}
.mascot.small{width:58px;height:76px}.mascot.mbig{width:150px;height:190px}.chwrap{position:relative;width:100%;height:100%}.chwrap .acc{position:absolute;left:-10px;bottom:10px;font-size:30px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}.mascot.mbig .acc{font-size:50px}
.mascot.hop{animation:mhop .45s ease}.mascot.cheer{animation:mhop .6s ease}.mascot.sad{animation:shake .5s}.mascot.idle{animation:none}.mascot.dance{animation:none}
@keyframes mhop{0%{transform:translateY(0)}45%{transform:translateY(-34px) scale(1.12,.92)}100%{transform:translateY(0)}}
@keyframes mcheer{0%{transform:translateY(0) rotate(0)}35%{transform:translateY(-44px) rotate(-15deg)}70%{transform:translateY(-44px) rotate(375deg)}100%{transform:translateY(0) rotate(360deg)}}
@keyframes mbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.track{position:relative;display:flex;gap:10px;justify-content:center;align-items:center;padding-top:100px;min-height:130px}
.stone{width:34px;height:20px;border-radius:50%;background:#dee2e6;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12);display:block}
.stone.done{background:var(--ok)}.stone.flag{background:none;box-shadow:none;width:auto;height:auto;font-size:30px}
.map{position:relative}.map{padding-top:30px}.map .mascot{width:72px;height:94px}
.hopword{position:relative;display:inline-block;padding-top:76px;font-size:84px;font-weight:bold;cursor:pointer}
.hopword.ltr{direction:ltr;font-family:Arial,sans-serif;font-size:72px}
.hopword span{display:inline-block;transition:color .2s,transform .2s;padding:0 2px}.hopword span.lit{color:var(--accent);transform:translateY(-6px)}
.objs span.counted{animation:pop .3s}
.scene span[data-m]{cursor:pointer;border-radius:16px;padding:4px}.scene span.chosen{background:rgba(255,255,255,.7);outline:4px solid var(--accent)}
.rvbadge{background:#fff3cd;color:#7a5b00;border-radius:999px;padding:4px 16px;font-size:18px;font-weight:bold}
.warmbtn{width:100%;margin-bottom:16px;background:linear-gradient(90deg,#ff8c42,#e63946)}.warmbtn.done{background:#8d99ae;font-size:20px}
.blob{display:inline-block;border-radius:50%;border:3px solid rgba(0,0,0,.25);box-shadow:inset -6px -8px 0 rgba(0,0,0,.12)}
.memgrid{display:grid;gap:12px;max-width:560px;flex:1}
.mcard{aspect-ratio:1;min-height:100px;border-radius:18px;background:linear-gradient(135deg,var(--accent),var(--accent2));position:relative;box-shadow:0 4px 0 rgba(0,0,0,.15);transition:transform .35s;transform-style:preserve-3d}
.mcard .mback,.mcard .mfront{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;border-radius:18px}
.mcard .mback{font-size:40px;color:#fff}.mcard .mfront{background:#fff;transform:rotateY(180deg)}
.mcard.flip{transform:rotateY(180deg)}.mcard.got{outline:5px solid var(--ok)}
body.tohar{--accent:#f4a261;--accent2:#2a9d8f;--bg:#fff7ec}
.chap{flex-basis:100%;font-size:24px;font-weight:bold;margin-top:10px;padding-right:6px}
.prompt.long{font-size:26px;max-width:820px;font-weight:normal;background:var(--card);border-radius:18px;padding:14px 20px}
.stars{font-size:22px;letter-spacing:2px}
.play{display:flex;flex-direction:column;align-items:center;gap:18px}
.dots{display:flex;gap:8px;justify-content:center}
.dots i{width:18px;height:18px;border-radius:50%;background:#dee2e6;display:block}
.dots i.done{background:var(--ok)}.dots i.cur{background:var(--accent)}
.prompt{font-size:32px;font-weight:bold;text-align:center;line-height:1.5}
.vis{font-size:44px;text-align:center;min-height:20px}
.en{direction:ltr;unicode-bidi:isolate;display:inline-block;font-family:Arial,sans-serif}
.eq{direction:ltr;unicode-bidi:isolate;font-size:56px;font-weight:bold;display:inline-block}
.objs{display:grid;grid-template-columns:repeat(5,auto);gap:6px 10px;justify-content:center;font-size:52px;direction:ltr}
.objs span{border-radius:14px;padding:2px 4px;transition:background .2s}
.objs span.counted{background:#ffe8a3}
.objs span.gone{opacity:.25;text-decoration:line-through;position:relative}
.objs span.gone::after{content:"✕";position:absolute;inset:0;color:var(--bad);font-size:56px;display:flex;align-items:center;justify-content:center;opacity:1}
.opts{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;width:100%}
.opt{background:var(--card);border-radius:22px;min-width:120px;min-height:110px;padding:14px 22px;font-size:46px;font-weight:bold;box-shadow:0 4px 0 rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center}
.opt.heb{font-size:64px;font-family:Arial,"Noto Sans Hebrew",sans-serif}
.opt.word{font-size:46px}
.opt.wide{min-width:240px}
.opt.small{font-size:32px}
.opt.wrong{background:#ffd6d9;opacity:.5;pointer-events:none}
.opt.right{background:#c7f0e3}
.opt.off{opacity:.2;pointer-events:none}
.swatch{width:80px;height:80px;border-radius:50%;border:3px solid #ccc;display:inline-block}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.1;margin:0 6px}
.frac span:first-child{border-bottom:4px solid currentColor;padding:0 6px}
.numbox{direction:ltr;font-size:52px;font-weight:bold;background:var(--card);border-radius:18px;min-width:220px;min-height:84px;padding:6px 20px;text-align:center;border:4px solid var(--accent)}
.keypad{display:grid;grid-template-columns:repeat(3,92px);gap:12px;direction:ltr}
.keypad button{height:80px;border-radius:18px;background:var(--card);font-size:36px;font-weight:bold;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.keypad .ok{background:var(--ok);color:#fff}
.keypad .del{background:#ffe5d0}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.toolbar{display:flex;gap:12px;justify-content:center}
.hintbox{background:#fff6d6;border:3px dashed #f4b400;border-radius:18px;padding:14px 20px;font-size:24px;max-width:800px;text-align:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50}
.modal .box{background:var(--card);border-radius:26px;padding:24px;text-align:center;max-width:94vw}
.pin{display:flex;gap:12px;justify-content:center;margin:14px 0;direction:ltr}
.pin i{width:26px;height:26px;border-radius:50%;border:3px solid var(--ink);display:block}
.pin i.f{background:var(--ink)}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.item{background:var(--card);border-radius:20px;padding:12px;text-align:center;box-shadow:0 3px 8px rgba(0,0,0,.08)}
.item .e{font-size:62px;display:block;height:80px;display:flex;align-items:center;justify-content:center}
.item .bgprev{width:90px;height:62px;border-radius:12px;margin:6px auto 12px}
.item .n{font-size:19px;min-height:48px}
.item button{margin-top:6px;border-radius:14px;padding:8px 14px;background:var(--accent);color:#fff;font-weight:bold;font-size:20px;width:100%}
.item button[disabled]{background:#adb5bd}
.item.own button{background:var(--ok)}
.scene{border-radius:26px;min-height:420px;padding:26px;display:flex;flex-wrap:wrap;gap:12px;align-content:flex-start;justify-content:center;font-size:72px;box-shadow:inset 0 0 0 6px rgba(255,255,255,.6)}
.scene span{animation:pop .4s}
@keyframes pop{0%{transform:scale(0)}80%{transform:scale(1.2)}100%{transform:scale(1)}}
.chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:14px 0}
.chips button{border-radius:999px;padding:10px 18px;background:var(--card);font-size:19px;box-shadow:0 2px 5px rgba(0,0,0,.1)}
.chips button.on{outline:4px solid var(--accent)}
.result{text-align:center}
.result .st{font-size:90px;letter-spacing:6px}
.burst{position:fixed;pointer-events:none;font-size:40px;z-index:60;animation:fly 1.1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(360deg);opacity:0}}
.parent table{width:100%;border-collapse:collapse;font-size:18px}
.parent td,.parent th{border-bottom:1px solid #e9ecef;padding:6px;text-align:right}
.parent select{font-size:18px;padding:6px;border-radius:10px;max-width:280px}
.parent input{font-size:20px;padding:8px;border-radius:10px;border:2px solid #ced4da;font-family:inherit;user-select:text;-webkit-user-select:text}
.parent .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}
.small-btn{border-radius:12px;padding:10px 16px;background:var(--accent2);color:#fff;font-size:18px;font-weight:bold}
.small-btn.warn{background:var(--bad)}
.note{font-size:17px;opacity:.75}
.banner{background:linear-gradient(90deg,#ffd166,#ff8c42);color:#2b2d42;border-radius:20px;padding:16px;text-align:center;font-size:26px;font-weight:bold;margin:12px 0}
</style>
</head>

<div id="app"></div>
<script>
"use strict";
/* ============ helpers ============ */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const fmt=n=>Number(n).toLocaleString('en-US');
const $=s=>document.querySelector(s);
const en=t=>`<span class="en">${t}</span>`;
const eq=t=>`<span class="eq">${t}</span>`;
function numOpts(ans,lo,hi,n){const s=new Set([ans]);let g=0;while(s.size<n&&g++<200){s.add(R(Math.max(lo,ans-3),Math.min(hi,ans+3)));}while(s.size<n&&g++<400)s.add(R(lo,hi));return shuffle([...s]).map(v=>({v,label:String(v)}));}
function objs(e,n,gone=0){let h='';for(let i=0;i<n;i++)h+=`<span class="${i>=n-gone?'gone':''}">${e}</span>`;return `<div class="objs tap">${h}</div>`;}
function frac(a,b){return `<span class="frac"><span>${a}</span><span>${b}</span></span>`;}

/* ============ speech ============ */
let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices()||[];}catch(e){voices=[];}}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
function voiceFor(l){try{const want=S&&S.voice&&S.voice[l];if(want){const v=voices.find(v=>v.name===want);if(v)return v;}}catch(e){}

שוות.":"aea846643e8c","כאן השלם חולק ל־4 משבצות – המכנה 4. סופרים את המשבצות הצבועות מה־0 עד החץ: 3. החץ מסמן שלושה רבעים.":"ac86eef9aabe","אחרי 1 ממשיכים לספור באותן משבצות: ארבעה רבעים הם שלם אחד, וחמישה רבעים כבר אחרי ה־1.":"66890b259e9c","כל שלם מחולק לחלקים שווים. עד איזה שבר הגיע החץ?":"8b5f68d5a198","שבר שהמונה שלו גדול מהמכנה – גדול משלם. אפשר לכתוב אותו כמספר מעורב: מספר שלם ועוד שבר.":"214d51bd0806","שבעה שלישים: כמה פעמים 3 נכנס ב־7? פעמיים (זה 6), ונשאר 1. אז שבעה שלישים = 2 שלמים ושליש.":"93e106f32fb9","ולהפך: 2 ושליש – כל שלם הוא 3 שלישים. 2 × 3 = 6, ועוד 1 – 7 שלישים.":"3a06254444ab","איזה מספר מעורב שווה לשבר?":"da2c8f55b764","השלימי את המונה החסר":"33bb177099fc","כשהמכנים שווים, החלקים באותו גודל. אז פשוט סופרים: המכנה נשאר, ומחברים את המונים.":"c9539c64a389","בחיסור – אותו דבר: המכנה נשאר, ומחסרים את המונים.":"900a121e2213","חברי את השברים":"026889246605","כשהמכנים שווים, המכנה נשאר אותו דבר – ורק מחברים או מחסרים את המונים.":"171021ea079b","חסרי את השברים":"cec2cd77e362","כמה זה שלושה רבעים מתוך 20 חרוזים? שלב 1: מחלקים ל־4 קבוצות שוות – 20 : 4 = 5. זה רבע אחד.":"cfd87ecc3d41","שלב 2: לוקחים 3 קבוצות כאלה: 5 × 3 = 15. אז שלושה רבעים מתוך 20 הם 15.":"9034482799f9","3 פיצות מתחלקות שווה בשווה בין 4 ילדות. כל פיצה נחתכת ל־4, וכל ילדה מקבלת חתיכה מכל פיצה – 3 רבעים.":"7ec0d80e2662","הכלל: חילוק אפשר לכתוב כשבר. מה שמחלקים – במונה, ובין כמה מחלקים – במכנה.":"e980979dcac3","טריקים ללוח הכפל: כפול 5 – חצי מכפול 10. כפול 9 – כפול 10, פחות פעם אחת. כפול 4 – כפול 2 ועוד פעם כפול 2.":"944a78af5411","לכל ספרה יש מקום. סופרים מימין לשמאל: אחדות, עשרות, מאות, אלפים, עשרות אלפים.":"e581d9359034","במספר 47,385: ספרת המאות היא 3, ספרת האלפים היא 7. ו־4 עשרות אלפים + 7 אלפים + 3 מאות + 8 עשרות + 5 אחדות = 47,385.":"b39b822e7b47","כמה מאות שלמות יש ב־47,385? מכסים את מה שמימין למאות (85), ונשאר 473.":"96a1b32296f2","מהי ספרת המאות במספר?":"f211380c64a2","סופרים מימין לשמאל: אחדות, עשרות, מאות, אלפים, עשרות אלפים, מאות אלפים.":"dfbdefe2f7d0","מהי ספרת העשרות במספר?": function lineSvg(n,max=10){const W=620,x=i=>30+i*(560/max);let s=`<line x1="20" y1="60" x2="${W-10}" y2="60" stroke="#2b2d42" stroke-width="4"/>`;for(let i=0;i<=max;i++){s+=`<line x1="${x(i)}" y1="48" x2="${x(i)}" y2="72" stroke="#2b2d42" stroke-width="3"/><text x="${x(i)}" y="105" font-size="26" text-anchor="middle" font-family="Arial" fill="${i===n?'#e63946':'#2b2d42'}" font-weight="${i===n?'bold':'normal'}">${i}</text>`;if(i>0&&i<=n)s+=`<path d="M${x(i-1)} 45 Q${(x(i-1)+x(i))/2} 10 ${x(i)} 45" fill="none" stroke="#2a9d8f" stroke-width="3"/>`;}s+=`<path d="M${x(n)} 40 l-12 -22 h24 z" fill="#e63946"/>`;return `<div style="direction:ltr">${svgWrap(W,120,s)}</div>`;}
function bondSvg(w,a,b){const c=(x,big)=>`<div class="bondc ${big?'bw':''}">${x}</div>`;return `<div style="display:flex;flex-direction:column;align-items:center;gap:6px;direction:ltr">${c(w,1)}<div style="font-size:36px">↙ ↘</div><div style="display:flex;gap:60px">${c(a)}${c(b)}</div></div>`;}

function chunks(w){const out=[];for(const c of w){if(/[א-ת]/.test(c))out.push(c);else if(out.length)out[out.length-1]+=c;}return out;}

 h.L.filter(l=>LFIN[l]).forEach(l=>sl.push({t:`לָאוֹת ${LN[l]} יֵשׁ גַּם צוּרָה סוֹפִית – כּוֹתְבִים אוֹתָהּ רַק בְּסוֹף מִלָּה.`,v:`<div class="lbig">${l} ➜ ${LFIN[l]}</div>`}));

 if((h.X||[]).includes('ב~'))sl.push({t:'בּ עִם נְקֻדָּה בָּאֶמְצַע אוֹמְרִים בּ. ב בְּלִי נְקֻדָּה אוֹמְרִים כְּמוֹ ו – כְּמוֹ בְּסוֹף הַמִּלָּה חָלָב.',v:`<div class="lbig">בּ · ב</div><div class="lword" data-he="חָלָב">חָלָב 🥛</div>`});

 if((h.X||[]).includes('פ~'))sl.push({t:'פּ עִם נְקֻדָּה אוֹמְרִים פּ, כְּמוֹ בְּפָּרָה. פ בְּלִי נְקֻדָּה אוֹמְרִים פ רַכָּה, כְּמוֹ בְּסוֹף הַמִּלָּה כַּף.',v:`<div class="lbig">פּ · פ · ף</div>`});

function passedStages(k,subs){const kd=S.kids[k],out=[];subs.forEach(s=>{const pr=kd.progress[s]||{};SUBJECTS[s].stages.forEach((st,i)=>{if(st.g&&(pr[i]||{}).stars>=2&&!(pr[i]||{}).skipped)out.push({s,i});});});return out;}
function missW(k,src){const m=(S.kids[k].miss||{})[src.s+':'+src.i]||0;return m;}
function weighted(list,w){const tot=list.reduce((a,x)=>a+w(x),0);let r=Math.random()*tot;for(const x of list){r-=w(x);if(r<=0)return x;}return list[list.length-1];}
function reviewPick(s,i){const c=passedStages(cur.kid,[s]).filter(x=>x.i<i);if(!c.length)return null;return weighted(c,x=>1+3*missW(cur.kid,x)+(x.i>=i-4?1:0));}
function noteMiss(src,d){if(!src)return;const kd=S.kids[cur.kid];kd.miss=kd.miss||{};const k=src.s+':'+src.i;kd.miss[k]=Math.max(0,Math.min(5,(kd.miss[k]||0)+d));if(!kd.miss[k])delete kd.miss[k];save();}
function warmAvailable(){return passedStages(cur.kid,KIDS[cur.kid].subjects).length>=2;}
function warmDone(){const kd=S.kids[cur.kid];return kd.warm===today();}
function startWarm(){const pool=passedStages(cur.kid,KIDS[cur.kid].subjects);if(pool.length<2)return;const qs=[];for(let k=0;k<5;k++){const src=weighted(pool,x=>1+4*missW(cur.kid,x));const q=SUBJECTS[src.s].stages[src.i].g();q.src=src;qs.push(q);}
 G={warm:true,s:qs[0].src.s,i:qs[0].src.i,qs,n:0,first:0,coins:0,helps:0,tries:0,helped:false,input:'',replay:false,base:qs.length,extra:0};showQ();}

 const msg=K.m?'כָּל הַכָּבוֹד! הַחִמּוּם שֶׁל הַיּוֹם הֻשְׁלַם':'כל הכבוד! החימום של היום הושלם';
 app.innerHTML=`<div class="result card" style="margin-top:30px"><div class="mascot dance mbig" style="position:static;display:inline-block">${masc()}</div><div class="st">🔥</div><div class="prompt">${msg}</div><p style="font-size:28px">הרווחת 🪙 ${G.coins+bonus}</p><div class="toolbar"><button class="big" id="hb">🏠 לבית</button></div></div>`;
 speak([msg]);$('#hb').onclick=()=>kidHome();}
function runMemory(s,i){const st=SUBJECTS[s].stages[i],K=KIDS[cur.kid];const items=shuffle(st.mem.items()).slice(0,st.mem.pairs);const cards=shuffle(items.concat(items).map((it,j)=>({...it,id:j})));
 const prev=(S.kids[cur.kid].progress[s]||{})[i]||{};G={s,i,qs:[],n:0,first:0,coins:0,helps:0,base:1,mem:true,replay:(prev.stars||0)>=3};let open=[],done=new Set(),miss=0,lock=false;
 app.innerHTML=`<div class="topbar"><button class="iconbtn" id="x">✖</button><div class="title" style="text-align:center">🃏 ${st.t}</div>${coinsPill()}</div>
 <div style="display:flex;gap:20px;align-items:flex-end;justify-content:center;flex-wrap:wrap"><div class="mascot" id="masc" style="position:static">${masc()}</div>
 <div class="memgrid" style="grid-template-columns:repeat(${cards.length<=6?3:4},1fr)">${cards.map((c,j)=>`<button class="mcard" data-j="${j}"><span class="mback">⭐</span><span class="mfront">${c.label}</span></button>`).join('')}</div></div>`;
 $('#x').onclick=()=>{speechSynthesis.cancel();map(s);};
 speak([K.m?'מְצָא אֶת הַזּוּגוֹת!':'מִצְאִי אֶת הַזּוּגוֹת!']);
 app.querySelectorAll('.mcard').forEach(b=>b.onclick=()=>{const j=+b.dataset.j,c=cards[j];if(lock||done.has(j)||open.includes(j))return;b.classList.add('flip');speak([c.say]);open.push(j);
  if(open.length===2){const [a,bj]=open;if(cards[a].k===cards[bj].k){done.add(a);done.add(bj);open=[];sndOk();anim($('#masc'),'cheer');app.querySelectorAll('.mcard').forEach(x=>{if(done.has(+x.dataset.j))x.classList.add('got');});
    if(!G.replay){S.kids[cur.kid].coins+=1;G.coins+=1;$('#coins').textContent='🪙 '+S.kids[cur.kid].coins;}save();
    if(done.size===cards.length){G.first=miss<=st.mem.pairs?1:miss<=st.mem.pairs*2?0.8:0.5;setTimeout(finish,1200);}}
   else{miss++;lock=true;setTimeout(()=>{app.querySelectorAll('.mcard').forEach(x=>{if(open.includes(+x.dataset.j))x.classList.remove('flip');});open=[];lock=false;},1100);}}});}
function readAll(){const r=(S.readAll||{})[cur.kid];return r===undefined?cur.kid!=='tamar':r;}
function runStage(s,i){const st=SUBJECTS[s].stages[i];if(st.mem){runMemory(s,i);return;}const qs=[],keys=new Set();let g=0;const N=SUBJECTS[s].qn||QN;while(qs.length<N&&g++<300){const q=st.g();if(keys.has(q.key)&&g<250)continue;keys.add(q.key);q.src={s,i};qs.push(q);}
 const rv=reviewPick(s,i);if(rv&&qs.length>=4){const q=SUBJECTS[rv.s].stages[rv.i].g();q.src=rv;q.review=true;qs[qs.length-1]=q;}
 const prev=(S.kids[cur.kid].progress[s]||{})[i]||{};G={s,i,qs,n:0,first:0,coins:0,helps:0,tries:0,helped:false,input:'',replay:(prev.stars||0)>=3,base:qs.length,extra:0};showQ();}

 const dots=G.qs.map((_,j)=>`<i class="${j<G.n?'done':j===G.n?'cur':''}"></i>`).join('');

 if(q.type==='num'){body=`<div class="numbox" id="nb">&nbsp;</div><div class="keypad">${[7,8,9,4,5,6,1,2,3].map(d=>`<button data-d="${d}">${d}</button>`).join('')}<button class="del" data-d="del">⌫</button><button data-d="0">0</button><button class="ok" data-d="ok">✔</button></div>`;}
 else body=`<div class="opts">${q.opts.map((o,j)=>`<button class="opt ${o.cls||''}" data-j="${j}">${o.label}</button>`).join('')}</div>`;

 <div class="play">${q.review||G.warm?`<div class="rvbadge">${G.warm?'🔥 חִמּוּם':'🔁 חֲזָרָה'} · ${SUBJECTS[src.s].stages[src.i].t}</div>`:''}<div class="prompt ${q.big?'long':''}">${q.prompt}</div>${q.vis?`<div class="vis">${q.vis}</div>`:''}${body}<div id="hint"></div>
 <div class="toolbar"><button class="iconbtn" id="spk">🔊</button><button class="iconbtn" id="help">💡</button><button class="iconbtn" id="les" title="הסבר">📘</button>${SUBJECTS[src.s].stages[src.i].W?'<button class="iconbtn" id="dic" title="מילון">📖</button>':''}${G.warm?'':'<button class="iconbtn" id="skip" title="דילוג">⏭</button>'}</div></div>`;
 $('#x').onclick=()=>{speechSynthesis.cancel();if(G.warm)kidHome();else map(G.s);};
 $('#spk').onclick=()=>speak(q.say);
 $('#help').onclick=()=>askPin(()=>giveHelp(q));
 let li=src.i;while(li>0&&!SUBJECTS[src.s].stages[li].L)li--;if(!SUBJECTS[src.s].stages[li].L)$('#les').style.display='none';
 $('#les').onclick=()=>{const keep=G.tries;showLesson(src.s,li,()=>{showQ();G.tries=keep;});};
 if($('#dic'))$('#dic').onclick=()=>{const keep=G.tries;showDict('המילים של השלב',SUBJECTS[src.s].stages[src.i].W,()=>{showQ();G.tries=keep;},'חזרה לשאלה ⬅');};
 if($('#skip'))$('#skip').onclick=()=>askPin(()=>{const kd=S.kids[cur.kid],pr=kd.progress[G.s]=kd.progress[G.s]||{};const p=pr[G.i]||{};if((p.stars||0)<2)kd.goal.done++;kd.days[today()]=(kd.days[today()]||0)+1;pr[G.i]=Object.assign(p,{stars:Math.max(p.stars||0,2),skipped:true});save();speechSynthesis.cancel();if(G.i<SUBJECTS[G.s].stages.length-1)startStage(G.s,G.i+1);else map(G.s);},'⏭ דילוג על השלב – קוד הורים');
 app.querySelectorAll('.objs.tap').forEach(box=>{let c=0;box.querySelectorAll('span:not(.gone)').forEach(sp=>sp.onclick=()=>{if(sp.classList.contains('counted'))return;sp.classList.add('counted');c++;speak([NUMW[c]||String(c)]);});});
 if(q.type==='num'){app.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const d=b.dataset.d;if(d==='del')G.input=G.input.slice(0,-1);else if(d==='ok'){if(G.input!=='')answer(G.input,null);return;}else if(G.input.length<7)G.input+=d;$('#nb').innerHTML=G.input?fmt(G.input):'&nbsp;';});}
 else app.querySelectorAll('.opt').forEach(b=>b.onclick=e=>{if(e.target.closest('.objs')&&e.target.tagName==='SPAN'){}answer(q.opts[+b.dataset.j].v,b);});
 // in "more/less" stage the groups are answers, not counters
 app.querySelectorAll('.opt .objs').forEach(o=>o.classList.remove('tap'));
 requestAnimationFrame(()=>{const m=$('#masc');m.style.transition='none';trackTo(Math.max(0,G.n-1),false);void m.offsetWidth;m.style.transition='';if(G.n>0)setTimeout(()=>trackTo(G.n,true),80);m.onclick=()=>{anim(m,'cheer');tone([660,880]);};runHopWords();});
 const pq=G.qs[G.n-1];const kind=x=>(x.src?x.src.s+':'+x.src.i:'')+'|'+String(x.key||'').replace(/[^A-Za-z]/g,'');const newType=G.n===0||!pq||kind(pq)!==kind(q);
 setTimeout(()=>{if(newType||readAll())speak(q.say);else if(q.cue)speak(q.cue);},250);
}
function answer(v,btn){const q=G.qs[G.n],K=KIDS[cur.kid];
 if(String(v)===String(q.ans)){
  if(btn)btn.classList.add('right');else $('#nb').style.borderColor='var(--ok)';
  let c=G.tries===0?2:G.tries===1?1:0;if(G.helped)c=Math.min(c,1);if(G.replay||G.n>=G.base)c=0;if(G.tries===0&&!G.helped&&G.n<G.base)G.first++;
  G.coins+=c;S.kids[cur.kid].coins+=c;save();$('#coins').textContent='🪙 '+S.kids[cur.kid].coins;
  if(G.tries===0&&(q.review||G.warm))noteMiss(q.src,-1);
  sndOk();if(c)setTimeout(sndCoin,350);burst(K.burst,10);
  toast(pick(K.praise));
  app.querySelectorAll('.opt,.keypad button').forEach(b=>b.style.pointerEvents='none');
  anim($('#masc'),'cheer');if(G.n===G.qs.length-1)setTimeout(()=>trackTo(G.qs.length,true),600);
  setTimeout(()=>{G.n++;if(G.n<G.qs.length)showQ();else if(G.warm)finishWarm();else finish();},1300);
 }else{
  G.tries++;sndBad();if(G.tries===1)noteMiss(q.src,1);if(btn)btn.classList.add('wrong');else{const nb=$('#nb');nb.classList.add('shake');setTimeout(()=>{nb.classList.remove('shake');},400);G.input='';nb.innerHTML='&nbsp;';}
  toast(K.retry,true);anim($('#masc'),'sad');
  if(G.tries===1)setTimeout(()=>showHint(q,false),700);
  else if(G.tries===2)setTimeout(()=>{showHint(q,true);const lb=$('#les');if(lb&&lb.style.display!=='none')lb.classList.add('pulse');},700);
  else setTimeout(()=>reveal(q),700);
 }
}
function hintSay(q){const d=document.createElement('div');d.innerHTML=q.hint;return d.textContent.replace(/[→|]/g,' ').trim();}
function showHint(q,narrow){G.helped=true;$('#hint').innerHTML=`<div class="hintbox">💡 ${q.hint}</div>`;speak([hintSay(q)]);
 if(narrow&&q.opts){const wrong=[...app.querySelectorAll('.opt:not(.wrong):not(.off)')].filter(b=>String(q.opts[+b.dataset.j].v)!==String(q.ans));if(wrong.length>1)pick(wrong).classList.add('off');}}

 if(q.opts){const j=q.opts.findIndex(o=>String(o.v)===String(q.ans));const b=app.querySelectorAll('.opt')[j];app.querySelectorAll('.opt').forEach(x=>{if(x!==b)x.classList.add('off');});b.classList.add('showme');shown=q.opts[j].label;}

 $('#hint').innerHTML=`<div class="hintbox reveal">${K.m?'בּוֹא נִלְמַד: הַתְּשׁוּבָה הִיא':'בואי נלמד: התשובה היא'} <b>${shown}</b><br>${q.hint}<br><small>${K.m?'גַּע בַּתְּשׁוּבָה. אַחַר כָּךְ תְּקַבֵּל עוֹד תַּרְגִּיל דּוֹמֶה.':'געי בתשובה. אחר כך תקבלי עוד תרגיל דומה.'}</small></div>`;
 speak([K.m?'בּוֹא נִלְמַד. הִנֵּה הַתְּשׁוּבָה הַנְּכוֹנָה.':'בואי נלמד. הנה התשובה הנכונה.',hintSay(q)]);
 if(G.extra<3){G.extra++;const sr=q.src||{s:G.s,i:G.i};const nq=SUBJECTS[sr.s].stages[sr.i].g();nq.src=sr;nq.review=q.review;G.qs.push(nq);}}

 kd.coins+=bonus;const pr=kd.progress[G.s]=kd.progress[G.s]||{};const prev=pr[G.i]||{};
 if((prev.stars||0)<2&&stars>=2)kd.goal.done++;
 pr[G.i]={stars:Math.max(prev.stars||0,stars),plays:(prev.plays||0)+1,last:Math.round(r*100)};
 kd.log.unshift({d:new Date().toISOString().slice(0,16).replace('T',' '),s:G.s,i:G.i,score:Math.round(r*100),helps:G.helps});kd.log=kd.log.slice(0,60);save();

 m.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const d=b.dataset.d;if(d==='x'){m.remove();return;}if(d==='del')v=v.slice(0,-1);else v+=d;if(v.length===4){m.remove();cb(v);return;}draw();});};draw();document.body.appendChild(m);}

 const draw=()=>{m.innerHTML=`<div class="box"><div style="font-size:26px;font-weight:bold">${title||'🔒 קוד הורים'}</div><div class="pin">${[0,1,2,3].map(i=>`<i class="${i<v.length?'f':''}"></i>`).join('')}</div>
 <div class="keypad" style="margin:0 auto">${[1,2,3,4,5,6,7,8,9].map(d=>`<button data-d="${d}">${d}</button>`).join('')}<button class="del" data-d="x">✖</button><button data-d="0">0</button><button class="del" data-d="del">⌫</button></div></div>`;
 m.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const d=b.dataset.d;if(d==='x'){m.remove();return;}if(d==='del')v=v.slice(0,-1);else v+=d;if(v.length===4){if(v===S.pin){m.remove();ok();return;}sndBad();m.querySelector('.box').classList.add('shake');v='';setTimeout(draw,400);return;}draw();});};

 $('#back').onclick=()=>kidHome();
 app.querySelectorAll('[data-bg]').forEach(b=>b.onclick=()=>{kd.bg=b.dataset.bg;save();room();});
 app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{kd.acc=b.dataset.m;kd.mascot=null;save();tone([523,784,1046]);burst([b.dataset.m,'✨'],12);room();});
 if($('#defm'))$('#defm').onclick=()=>{kd.acc=null;kd.mascot=null;save();room();};
}

/* ============ parent area ============ */
function parent(){cur.kid=null;setTheme();
 const hv=voiceFor('he'),ev=voiceFor('en');
 app.innerHTML=`<div class="parent"><div class="topbar"><button class="iconbtn" id="back">🏠</button><div class="title">🔒 אזור הורים</div><button class="small-btn" id="chpin" style="font-size:20px;padding:12px 18px">🔑 שינוי קוד הורים</button></div>${S.pin==='1234'?'<div class="banner" style="font-size:20px">⚠ קוד ההורים עדיין 1234 – כדאי להחליף (הכפתור למעלה)</div>':''}
 ${Object.entries(KIDS).map(([k,K])=>{const kd=S.kids[k];return `<div class="card" style="text-align:right;margin-bottom:16px"><b style="font-size:26px">${K.face} ${K.name}</b> · 🪙 ${kd.coins} · 💡 עזרות: ${kd.help}
  <div class="row">יעד: <input id="gn_${k}" value="${kd.goal.name.replace(/"/g,'&quot;')}" style="width:240px"> אחרי <input id="gt_${k}" type="number" min="1" value="${kd.goal.target}" style="width:70px">
   <select id="gy_${k}"><option value="days" ${kd.goal.type==='days'?'selected':''}>ימי תרגול</option><option value="stages" ${kd.goal.type!=='days'?'selected':''}>שלבים חדשים</option></select>
   <span id="gmw_${k}">· יום נספר אחרי <input id="gm_${k}" type="number" min="1" value="${kd.goal.min||3}" style="width:60px"> שלבים</span> <button class="small-btn" data-gs="${k}">שמור יעד</button></div>
  <div class="row">התקדמות ליעד: ${goalDone(kd)} / ${kd.goal.target} ${goalUnit(kd.goal)} <button class="small-btn" data-gr="${k}">✔ היעד מומש – מתחילים מחדש</button></div>
  <div class="row"><label><input type="checkbox" data-ra="${k}" ${((S.readAll||{})[k]===undefined?k!=='tamar':(S.readAll||{})[k])?'checked':''}> להקריא כל שאלה (כבוי = רק בתחילת סוג שאלה חדש)</label></div>
  <div class="row">מטבעות: <button class="small-btn" data-c="${k}" data-v="10">+10</button><button class="small-btn" data-c="${k}" data-v="-10">−10</button> · לקבוע ל־<input id="cs_${k}" type="number" min="0" style="width:90px"> <button class="small-btn" data-cs="${k}">קבע</button></div>
  <table><tr><th>תאריך</th><th>שלב</th><th>ציון</th><th>עזרות</th></tr>${kd.log.slice(0,8).map(l=>`<tr><td>${l.d}</td><td>${SUBJECTS[l.s].title} · ${SUBJECTS[l.s].stages[l.i].t}</td><td>${l.score}%</td><td>${l.helps}</td></tr>`).join('')||'<tr><td colspan="4">עוד לא שיחקו</td></tr>'}</table>
  <div class="row"><button class="small-btn warn" data-rs="${k}">איפוס ההתקדמות של ${K.name}</button></div></div>`;}).join('')}
 <div class="card" style="text-align:right">

  <div class="row">מחירי החנות: <select id="px">${[4,6,10,15].map(x=>`<option value="${x}" ${((S.priceX||6)===x)?'selected':''}>${x===4?'זול':x===6?'רגיל':x===10?'יקר':'יקר מאוד'} (×${x})</option>`).join('')}</select> <span class="note">שלב שלם שווה עד 16 מטבעות. שלב שכבר קיבל 3 כוכבים לא נותן מטבעות.</span></div>
  <div class="row"><label><input type="checkbox" id="ua" ${S.unlockAll?'checked':''}> לפתוח את כל השלבים (בלי לעבור לפי הסדר)</label></div>
  <div class="row">קול עברית: <select id="vhe">${voices.filter(v=>/^(he|iw)/i.test(v.lang)).map(v=>`<option ${hv&&hv.name===v.name?'selected':''}>${v.name}</option>`).join('')||'<option>לא נמצא</option>'}</select>
   קול אנגלית: <select id="ven">${voices.filter(v=>/^en/i.test(v.lang)).map(v=>`<option ${ev&&ev.name===v.name?'selected':''}>${v.name}</option>`).join('')||'<option>לא נמצא</option>'}</select></div>
  <div class="row">מהירות דיבור: <input type="range" id="vr" min="0.6" max="1.1" step="0.05" value="${(S.voice&&S.voice.rate)||0.9}" style="width:200px"> <button class="small-btn" id="tv">🔊 בדיקה</button></div>
  <div class="note">אם אין קול עברי: הגדרות ← ניהול כללי ← שפה וקלט ← המרת טקסט לדיבור ← מנוע Google ← להתקין עברית.</div>
  <div class="row"><button class="small-btn" id="ex">⬇ גיבוי</button><label class="small-btn" style="cursor:pointer">⬆ שחזור<input type="file" id="im" accept=".json" hidden></label></div>
 </div></div>`;
 $('#back').onclick=home;
 app.querySelectorAll('[data-gs]').forEach(b=>b.onclick=()=>{const k=b.dataset.gs;const g=S.kids[k].goal;const nt=$('#gy_'+k).value;if(nt!==g.type){g.since=today();g.done=0;}g.type=nt;g.name=$('#gn_'+k).value||'פרס';g.target=Math.max(1,+$('#gt_'+k).value||7);g.min=Math.max(1,+$('#gm_'+k).value||3);save();parent();});
 app.querySelectorAll('[data-gr]').forEach(b=>b.onclick=()=>{const g=S.kids[b.dataset.gr].goal;g.done=0;g.since=today();save();parent();});
 app.querySelectorAll('[data-ra]').forEach(b=>b.onchange=()=>{S.readAll=S.readAll||{};S.readAll[b.dataset.ra]=b.checked;save();});
 app.querySelectorAll('[data-cs]').forEach(b=>b.onclick=()=>{const v=+$('#cs_'+b.dataset.cs).value;if(v>=0){S.kids[b.dataset.cs].coins=v;save();parent();}});
 app.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const kd=S.kids[b.dataset.c];kd.coins=Math.max(0,kd.coins+ +b.dataset.v);save();parent();});
 app.querySelectorAll('[data-rs]').forEach(b=>{let armed=false;b.onclick=()=>{if(!armed){armed=true;b.textContent='לחצו שוב לאישור האיפוס';return;}S.kids[b.dataset.rs]=defKid();save();parent();};});
 $('#chpin').onclick=()=>pinPad('🔑 הקלידו קוד חדש',a=>pinPad('🔑 הקלידו שוב לאישור',b=>{if(a===b){S.pin=a;save();toast('הקוד הוחלף ✔');parent();}else{toast('הקודים לא תואמים',true);}}));
 $('#ua').onchange=e=>{S.unlockAll=e.target.checked;save();};$('#px').onchange=e=>{S.priceX=+e.target.value;save();};
 const sv=()=>{S.voice=S.voice||{};S.voice.he=$('#vhe').value;S.voice.en=$('#ven').value;S.voice.rate=+$('#vr').value;save();};
 ['#vhe','#ven','#vr'].forEach(id=>$(id).onchange=sv);
 $('#tv').onclick=()=>{sv();speak(['שָׁלוֹם! כָּכָה נִשְׁמָע הַקּוֹל בְּעִבְרִית. בָּ, מָ, לָ.',{t:'And this is English. Cat, cake, tree.',l:'en'}]);};
 $('#ex').onclick=()=>{const t=JSON.stringify(S);try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'application/json'}));a.download='learning-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();}catch(e){}
  try{navigator.clipboard.writeText(t).then(()=>{$('#ex').textContent='✔ הגיבוי הועתק';},()=>{});}catch(e){}};
 $('#im').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(d&&d.kids){S=d;for(const k in KIDS)if(!S.kids[k])S.kids[k]=defKid();save();parent();}}catch(err){}});};
}
home();
</script>
<script>if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});</script>
</body>
</html>
