<script>
"use strict";
/* ============ helpers ============ */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const fmt=n=>Number(n).toLocaleString('en-US');
const $=s=>document.querySelector(s);
const en=t=>`<span class="en">${t}</span>`;
const eq=t=>`<span class="eq">${t}</span>`;
function numOpts(ans,lo,hi,n){const s=new Set([ans]);let g=0;while(s.size<n&&g++<200){s.add(R(Math.max(lo,ans-3),Math.min(hi,ans+3)));}while(s.size<n&&g++<400)s.add(R(lo,hi));return shuffle([...s]).map(v=>({v,label:String(v)}));}
function objs(e,n,gone=0){let h='';for(let i=0;i<n;i++)h+=`<span class="${i>=n-gone?'gone':''}">${e}</span>`;return `<div class="objs tap">${h}</div>`;}
function frac(a,b){return `<span class="frac"><span>${a}</span><span>${b}</span></span>`;}

/* ============ speech ============ */
let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices()||[];}catch(e){voices=[];}}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
function voiceFor(l){try{const want=S&&S.voice&&S.voice[l];if(want){const v=voices.find(v=>v.name===want);if(v)return v;}}catch(e){}

1b9","בְּאֵיזוֹ קְבוּצָה יֵשׁ יוֹתֵר?":"c60056db410a","סְפֹר כַּמָּה יֵשׁ בְּכָל קְבוּצָה, וְאָז תַּשְׁוֶה.":"c1703bdeb551","בְּאֵיזוֹ קְבוּצָה יֵשׁ פָּחוֹת?":"9703342d0121","אֵיזֶה מִסְפָּר גָּדוֹל יוֹתֵר?":"3aa28984aca2","הַמִּסְפָּר שֶׁבָּא מְאֻחָר יוֹתֵר בַּסְּפִירָה הוּא הַגָּדוֹל.":"0494226bff98","אֵיזֶה מִסְפָּר קָטָן יוֹתֵר?":"28bc726aca47","הַמִּסְפָּר שֶׁבָּא קֹדֶם בַּסְּפִירָה הוּא הַקָּטָן.":"b372e5870470","אֵיזוֹ קְבוּצָה שָׁוָה לַמִּסְפָּר שֵׁשׁ?":"e7fc8b065c59","שָׁוֶה = בְּדִיּוּק אוֹתוֹ מִסְפָּר, לֹא יוֹתֵר וְלֹא פָּחוֹת.":"aff21a405af8","אֵיזוֹ קְבוּצָה שָׁוָה לַמִּסְפָּר שָׁלוֹשׁ?":"1dc20adc8ab7","אֵיזוֹ קְבוּצָה שָׁוָה לַמִּסְפָּר חָמֵשׁ?":"b58c1ff382bb","אֵיזוֹ קְבוּצָה שָׁוָה לַמִּסְפָּר שֶׁבַע?":"30800373ce18","אֵיזוֹ קְבוּצָה שָׁוָה לַמִּסְפָּר אַרְבַּע?":"08d6f36213a2","אֵיזוֹ קְבוּצָה שָׁוָה לַמִּסְפָּר שְׁמוֹנֶה?":"6b2b174272eb","אֵיזוֹ קְבוּצָה שָׁוָה לַמִּסְפָּר שְׁתַּיִם?":"53094ec66c0d","שָׁלֵם וַחֲלָקִים: הַשָּׁלֵם לְמַעְלָה, וְהַחֲלָקִים לְמַטָּה. שְׁנֵי הַחֲלָקִים בְּיַחַד הֵם הַשָּׁלֵם.":"7fc1b3cbf488","יֵשׁ 5 צָבִים. 3 בַּמַּיִם וְ־2 עַל הַחוֹל. 3 וְעוֹד 2 זֶה 5.":"4396460d201c","אִם חֵלֶק אֶחָד חָסֵר: הַשָּׁלֵם 5, חֵלֶק אֶחָד 3. כַּמָּה חָסֵר? סוֹפְרִים מִ־3 עַד 5: אַרְבַּע, חָמֵשׁ – חֲסֵרִים 2!":"30b8f40a19e4","הַשָּׁלֵם הוּא אַרְבַּע. חֵלֶק אֶחָד הוּא שְׁתַּיִם. מָה הַחֵלֶק הַשֵּׁנִי?":"08b774d2b28c","🚜🚜🚜🚜הַצִּיּוּרִים הַמְּחוּקִים הֵם הַחֵלֶק הַשֵּׁנִי.":"a9983d8450f6","הַשָּׁלֵם הוּא שָׁלוֹשׁ. חֵלֶק אֶחָד הוּא אַחַת. מָה הַחֵלֶק הַשֵּׁנִי?":"ad6e32db3bff","🚜🚜🚜הַצִּיּוּרִים הַמְּחוּקִים הֵם הַחֵלֶק הַשֵּׁנִי.":"21d62c77659d","הַשָּׁלֵם הוּא אַרְבַּע. חֵלֶק אֶחָד הוּא אַחַת. מָה הַחֵלֶק הַשֵּׁנִי?":"081b0df8236d","🚗🚗🚗🚗הַצִּיּוּרִים הַמְּחוּקִים הֵם הַחֵלֶק הַשֵּׁנִי.":"6ef7ce031c3a","הַשָּׁלֵם הוּא אַרְבַּע. חֵלֶק אֶחָד הוּא שָׁלוֹשׁ. מָה הַחֵלֶק הַשֵּׁנִי?":"50599ac79dea","🚓🚓🚓🚓הַצִּיּוּרִים הַמְּחוּקִים הֵם הַחֵלֶק הַשֵּׁנִי.":"3bc1f5caab94","🐶🐶🐶🐶הַצִּיּוּרִים הַמְּחוּקִים הֵם הַחֵלֶק הַשֵּׁנִי.":"f9b03289bc3d","🏎️🏎️🏎️🏎️הַצִּי  – לכמה חלקים שווים חילקנו. המונה (המספר למעלה) – כמה חלקים לקחנו או צבענו. כאן: 3 מתוך 5, כלומר שלוש חמישיות.":"a91cf03efd59","זה עובד גם בעיגול: חילקנו ל־4, צבענו 1 – רבע.":"7aa1abcb28ee","איזה חלק מהשלם צבוע?":"6528cedf8293","ספור לכמה חלקים שווים חולק השלם (זה המכנה), וכמה מהם צבועים (זה המונה).":"791dd0e5ef6a","באיזה ציור צבוע השבר?":"caf590b17b12","המכנה אומר לכמה חלקים שווים מחלקים, והמונה – כמה חלקים צובעים.":"91b522b4072c","על ישר המספרים, הקטע מ־0 עד 1 הוא שלם אחד. מחלקים אותו למשבצות שוות.":"1846832b9d9b","כאן השלם חולק ל־4 משבצות – המכנה 4. סופרים את המשבצות הצבועות מה־0 עד החץ: 3. החץ מסמן שלושה רבעים.":"c6a7007738d9","אחרי 1 ממשיכים לספור באותן משבצות: ארבעה רבעים הם שלם אחד, וחמישה רבעים כבר אחרי ה־1.":"76d707187dc5","כל שלם מחולק לחלקים שווים. עד איזה שבר הגיע החץ?":"987afd24823c","שבר שהמונה שלו גדול מהמכנה – גדול משלם. אפשר לכתוב אותו כמספר מעורב: מספר שלם ועוד שבר.":"b299bb67648c","שבעה שלישים: כמה פעמים 3 נכנס ב־7? פעמיים (זה 6), ונשאר 1. אז שבעה שלישים = 2 שלמים ושליש.":"f958af0a443e","ולהפך: 2 ושליש – כל שלם הוא 3 שלישים. 2 × 3 = 6, ועוד 1 – 7 שלישים.":"7bb682569922","איזה מספר מעורב שווה לשבר?":"00d0a21bf9d8","השלם את המונה החסר":"5279645ebde8","כשהמכנים שווים, החלקים באותו גודל. אז פשוט סופרים: המכנה נשאר, ומחברים את המונים.":"4a4110940aaa","בחיסור – אותו דבר: המכנה נשאר, ומחסרים את המונים.":"e967e9d327c8","חבר את השברים":"9527de00e186","כשהמכנים שווים, המכנה נשאר אותו דבר – ורק מחברים או מחסרים את המונים.":"03ed544a7268","חסר את השברים":"5bde2dda8112","כמה זה שלושה רבעים מתוך 20 חרוזים? שלב 1: מחלקים ל־4 קבוצות שוות – 20 : 4 = 5. זה רבע אחד.":"188fcdb35c71","שלב 2: לוקחים 3 קבוצות כאלה: 5 × 3 = 15. אז שלושה רבעים מתוך 20 הם 15.":"22b465b90649","3 פיצות מתחלקות שווה בשווה בין 4 ילדות. כל פיצה נחתכת ל־4, וכל ילדה מקבלת חתיכה מכל פיצה – 3 רבעים.":"d8d573b68779","הכלל: חילוק אפשר לכתוב כשבר. מה שמחלקים – במונה, ובין כמה מחלקים – במכנה.":"10379a352557","טריקים ללוח הכפל: כפול 5 – חצי מכפול 10. כפול 9 – כפול 10, פחות פעם אחת. כפול 4 – כפול 2 ועוד פעם כפול 2.":"f222ea11b67c","לכל ספרה יש מקום. סופרים מימין לשמאל: אחדות, עשרות, מאות, אלפים, עשרות אלפים.":"bb111bab163a","במספר 47,385: ספרת המאות היא 3, ספרת האלפים היא 7. ו־4 עשרות אלפים + 7 אלפים + 3 מאות + 8 עשרות + 5 אחדות = 47,385.":"b5596bc0aad8","כמה מאות שלמות יש ב־47,385? מכסים את מה שמימין למאות (85), ונשאר 473.":"c156d6f02a9b","מהי ספרת מאות האלפים במספר?":"aa393277abe1","סופרים מימין לשמאל: אחדות, עשרות, מאות, אלפים, עשרות אלפים, מאות אלפים.":"e99bd099fc99","מהי ספרת האחדות במספר?":"af606fa044f6","מהי ספרת המאות במספר?":"bf8177b3c31b","מהי ספרת העשרות במספר?":"a810b2872573","מהי ספרת עשרות האלפים במספר?":"79839dc0bd17","מהי ספרת האלפים במספר?":"4a28395e15df","איזה מספר זה?":"f398ce8bb4eb","כתוב כל ספרה במקום שלה: עשרות אלפים, אלפים, מאות, עשרות, אחדות. במקום שאין בו כלום – אפס.":"5819c471503e","כמה אלפים שלמות יש במספר?":"8bc5d6661409","מכסים את הספרות שמימין לאלפים – מה שנשאר משמאל הוא התשובה.":"349993c8a260","כמה מאות שלמות יש במספר?":"991ae18c70a2","מכסים את הספרות שמימין למאות – מה שנשאר משמאל הוא התשובה.":"075a016dcee8","כמה עשרות שלמות יש במספר?":"244ebd7c85a3","מכסים את הספרות שמימין לעשרות – מה שנשאר משמאל הוא התשובה.":"7bff63f30dc6","חיבור במאונך: כותבים אחדות מתחת לאחדות, עשרות מתחת לעשרות – ומתחילים מימין.":"ef477511990f","8 + 6 = 14: כותבים 4 ומעבירים 1 לעשרות. 5 + 7 + 1 = 13: כותבים 3 ומעבירים 1. ממשיכים כך עד הסוף: 3,834.":"41bb4f6333fe","בחיסור: אם הספרה למעלה קטנה מדי – פורטים: לוקחים 1 מהמקום שמשמאל, והוא שווה 10 במקום שלנו.":"7c98b573182a","כתוב את המספרים אחד מתחת לשני, אחדות מתחת לאחדות, ותתחיל מימין. אל תשכח להעביר או לפרוט.":"7bbdcc51a65e","כפל ב־10, 100, 1000: מוסיפים אפסים בסוף – אחד, שניים או שלושה. חילוק – מורידים אותם.":"0a0b518395e5","כפל דו־ספרתי: מפרקים לעשרות ואחדות. 34 × 6 = 30 × 6 + 4 × 6 = 180 + 24 = 204.":"c07c10cc87a3","חילוק מספר גדול: מפרקים לחלקים שקל לחלק. 156 : 6 → 120 : 6 = 20, ו־36 : 6 = 6. ביחד 26.":"22df7a404b7d","מילים שמסגירות את התרגיל: \"יותר מ־\" – חיבור. \"פחות מ־\" – חיסור. \"בכמה יותר\" – חיסור.":"c const fk=(a,b)=>Math.min(a,b)+'x'+Math.max(a,b);
function mfW(a,b){const kd=S.kids[cur.kid]||{};return 1+3*((kd.mf||{})[fk(a,b)]||0);}
function mfNote(f,d){if(!f)return;const kd=S.kids[cur.kid];kd.mf=kd.mf||{};kd.mfk=kd.mfk||{};if(d<0)kd.mfk[f]=1;kd.mf[f]=Math.max(0,Math.min(5,(kd.mf[f]||0)+d));if(!kd.mf[f])delete kd.mf[f];}
function mArr(a,b){return `<div style="display:inline-grid;grid-template-columns:repeat(${b},auto);gap:3px 5px;direction:ltr;margin:6px auto">${'<span style="width:13px;height:13px;border-radius:50%;background:#e76f51;display:inline-block"></span>'.repeat(a*b)}</div>`;}
const MRHYME={'7x8':'5, 6, 7, 8 → <b>56 = 7 × 8</b> (הספרות בסדר!)','3x4':'1, 2, 3, 4 → <b>12 = 3 × 4</b>','6x8':'שש כפול שמונה – ארבעים ושמונה (מתחרז!)','7x7':'7 × 7 = 49 – ממש לפני 50','8x8':'8 × 8 = 64 – "שמונה שמונה, שישים וארבע"','6x6':'6 × 6 = 36','6x7':'6 × 7 = 42','4x4':'4 × 4 = 16','3x3':'3 × 3 = 9','9x9':'9 × 9 = 81 – ספרות שסכומן 9'};
function mTrick(a,b){const p=a*b,f=fk(a,b),lo=Math.min(a,b),hi=Math.max(a,b);let t='';
 if(MRHYME[f]&&!(lo<=2||lo===10||hi===10))t='זכרי: '+MRHYME[f];
 else if(lo===1)t=`כל מספר כפול 1 נשאר אותו מספר: ${hi}.`;
 else if(hi===10||lo===10){const n=lo===10?hi:lo;t=`כפול 10 – מוסיפים 0 בסוף: ${n} → ${n*10}.`;}
 else if(lo===2){t=`כפול 2 זה כפליים: ${hi} + ${hi} = ${p}.`;}
 else if(a===5||b===5){const n=a===5?b:a;t=`כפול 5 זה חצי מכפול 10: ${n} × 10 = ${n*10}, והחצי – ${p}.`;}
 else if(a===9||b===9){const n=a===9?b:a;t=`כפול 9: ${n} × 10 = ${n*10}, ופחות ${n} אחד = ${p}.`;}
 else if(a===4||b===4){const n=a===4?b:a;t=`כפול 4 זה כפליים של כפליים: ${n} × 2 = ${n*2}, ועוד פעם כפליים = ${p}.`;}
 else if(a===3||b===3){const n=a===3?b:a;t=`כפול 3: ${n} × 2 = ${n*2}, ועוד ${n} אחד = ${p}.`;}
 else if(a===6||b===6){const n=a===6?b:a;t=`כפול 6: ${n} × 5 = ${n*5}, ועוד ${n} אחד = ${p}.`;}
 else{t=`${lo} × ${hi} = ${lo} × 5 + ${lo} × ${hi-5} = ${lo*5} + ${lo*(hi-5)} = ${p}.`;}
 return `${t}<br>${mArr(lo,hi)}`;}
function mPairs(fams,from=1,to=10){const out=[],seen=new Set();for(const f of fams)for(let b=from;b<=to;b++){const k=fk(f,b);if(!seen.has(k)){seen.add(k);out.push([f,b]);}}return out;}

function rPos(kd,it,i){const p=(kd.room||{})[it.id];if(p&&p.x!=null)return p;if(it.d)return{x:it.d[0],y:it.d[1]};return{x:10+(i*17)%80,y:99-(i%2)*3};}
function rZ(it,p){return it.L==='rug'?1:10+Math.round(p.y);}
function room(){const kd=S.kids[cur.kid],K=KIDS[cur.kid];const items=SHOP[curType()].filter(x=>kd.owned.includes(x.id));const bgs=items.filter(x=>x.bg);const bg=(SHOP[curType()].find(x=>x.id===kd.bg)||{}).bg||({g8:'linear-gradient(#e8e6f2 70%,#d8d2c8 70%)',tamar:'linear-gradient(#fde2e4 70%,#e2ece9 70%)',tohar:'linear-gradient(#e0f2fe 65%,#b7e4c7 65%)'}[curType()]||'linear-gradient(#cdeac0 70%,#d4a373 70%)');
 const things=items.filter(x=>!x.bg),toys=things.filter(x=>!x.s&&!x.dec);let ei=0;
 const ri=t=>{const p=rPos(kd,t,t.s?0:ei++);const st=`left:${p.x}%;top:${p.y}%;z-index:${rZ(t,p)}`;
  return t.s?`<div class="ri fu ${t.L==='lamp'?(p.off?'off':'lit'):''}" data-id="${t.id}" style="${st};width:${t.w}%">${art(t)}</div>`
   :`<div class="ri em ${t.dec?'dk':''} ${t.big?'xl':''} ${!t.dec&&accOf()===t.e?'chosen':''}" data-id="${t.id}" title="${t.n}" style="${st}">${t.e}</div>`;};
 const cn=CHARS[(KIDS[cur.kid]||{}).char||'fox'].name;
 app.innerHTML=`<div class="topbar"><button class="iconbtn" id="back">⬅</button><div class="title">${K.sceneTitle}</div>${coinsPill()}</div>
 ${bgs.length?`<div class="chips">${bgs.map(b=>`<button data-bg="${b.id}" class="${kd.bg===b.id?'on':''}">${b.n}</button>`).join('')}</div>`:''}
 ${things.length?`<div class="note" style="text-align:center;margin-bottom:8px"><span style="display:inline-block;width:60px;height:78px;vertical-align:middle">${masc()}</span> ${K.m?'אֶפְשָׁר לִגְרֹר דְּבָרִים וּלְסַדֵּר אֶת הַחֶדֶר.':'אפשר לגרור דברים ולסדר את החדר.'}${toys.length?' '+(K.m?`גַּע בִּפְרִיט – וְ${cn} יַחְזִיק אוֹתוֹ בַּמִּשְׂחָק.`:`געי בפריט – ו${cn} תחזיק אותו במשחק.`):''}${things.some(x=>x.L==='lamp')?' '+(K.m?'גַּע בִּמְנוֹרָה כְּדֵי לְהַדְלִיק וּלְכַבּוֹת.':'געי במנורה כדי להדליק ולכבות.'):''} ${accOf()?`<button class="small-btn" id="defm">${K.m?'בְּלִי פְּרִיט':'בלי פריט'}</button>`:''}</div>`:''}<div class="scene" id="scene" style="background:${bg}">${things.length?things.map(ri).join(''):`<div class="empty">עוד אין פה כלום… אפשר לקנות דברים בחנות 🛒</div>`}</div>`;
 $('#back').onclick=()=>kidHome();
 app.querySelectorAll('[data-bg]').forEach(b=>b.onclick=()=>{kd.bg=b.dataset.bg;save();room();});
 if($('#defm'))$('#defm').onclick=()=>{kd.acc=null;kd.mascot=null;save();room();};
 roomDrag(kd);
}
function roomDrag(kd){const sc=$('#scene');if(!sc)return;kd.room=kd.room||{};
 sc.querySelectorAll('.ri').forEach(el=>{el.oncontextmenu=e=>e.preventDefault();el.onpointerdown=e=>{if(e.button>0||el._pid!=null)return;e.preventDefault();
  const r=sc.getBoundingClientRect(),id=el.dataset.id,it=SHOP[curType()].find(x=>x.id===id);if(!it)return;
  const x0=parseFloat(el.style.left),y0=parseFloat(el.style.top),sx=e.clientX,sy=e.clientY;
  const hw=el.offsetWidth/r.width*50,hh=el.offsetHeight/r.height*100;let mv=false,x=x0,y=y0;el._pid=e.pointerId;
  try{el.setPointerCapture(e.pointerId);}catch(_){}
  el.onpointermove=ev=>{if(ev.pointerId!==el._pid)return;const dx=ev.clientX-sx,dy=ev.clientY-sy;if(!mv){if(Math.hypot(dx,dy)<10)return;mv=true;el.classList.add('drag');el.style.zIndex=999;}
   x=Math.min(100-hw,Math.max(hw,x0+dx/r.width*100));y=Math.min(100,Math.max(hh,y0+dy/r.height*100));el.style.left=x+'%';el.style.top=y+'%';};
  el.onpointerup=el.onpointercancel=ev=>{if(ev.pointerId!==el._pid)return;el._pid=null;el.onpointermove=el.onpointerup=el.onpointercancel=null;
   if(mv){el.classList.remove('drag');const p=kd.room[id]||{};p.x=+x.toFixed(1);p.y=+y.toFixed(1);kd.room[id]=p;el.style.zIndex=rZ(it,p);save();tone([660,880],.06);}
   else if(ev.type==='pointerup')roomTap(kd,it,el);};
 };});}
function roomTap(kd,it,el){
 if(!it.s&&!it.dec){kd.acc=it.e;kd.mascot=null;save();tone([523,784,1046]);burst([it.e,'✨'],12);room();return;}
 if(it.L==='lamp'){const p=kd.room[it.id]=kd.room[it.id]||{};p.off=!p.off;el.classList.toggle('off',p.off);el.classList.toggle('lit',!p.off);tone(p.off?[523,392]:[523,784],.08);save();return;}
 el.classList.remove('wig');void el.offsetWidth;el.classList.add('wig');tone([440,554],.07);
}

/* ============ parent area ============ */
function parent(){cur.kid=null;setTheme();
 const hv=voiceFor('he'),ev=voiceFor('en');
 app.innerHTML=`<div class="parent"><div class="topbar"><button class="iconbtn" id="back">🏠</button><div class="title">🔒 אזור הורים</div><button class="small-btn" id="chpin" style="font-size:20px;padding:12px 18px">🔑 שינוי קוד הורים</button></div>${S.pin==='1234'?'<div class="banner" style="font-size:20px">⚠ קוד ההורים עדיין 1234 – כדאי להחליף (הכפתור למעלה)</div>':''}
 ${Object.entries(KIDS).map(([k,K])=>{const kd=S.kids[k];return `<div class="card" style="text-align:right;margin-bottom:16px"><b style="font-size:26px">${K.face} ${K.name}</b> <button class="small-btn" data-ek="${k}">✏️ עריכה</button> · 🪙 ${kd.coins} · 💡 עזרות: ${kd.help}
  <div class="row">יעד: <input id="gn_${k}" value="${kd.goal.name.replace(/"/g,'&quot;')}" style="width:240px"> אחרי <input id="gt_${k}" type="number" min="1" value="${kd.goal.target}" style="width:70px">
   <select id="gy_${k}"><option value="days" ${kd.goal.type==='days'?'selected':''}>ימי תרגול</option><option value="stages" ${kd.goal.type!=='days'?'selected':''}>שלבים חדשים</option></select>
   <span id="gmw_${k}">· יום נספר אחרי <input id="gm_${k}" type="number" min="1" value="${kd.goal.min||3}" style="width:60px"> שלבים</span> <button class="small-btn" data-gs="${k}">שמור יעד</button></div>
  <div class="row">התקדמות ליעד: ${goalDone(kd)} / ${kd.goal.target} ${goalUnit(kd.goal)} <button class="small-btn" data-gr="${k}">✔ היעד מומש – מתחילים מחדש</button></div>
  <div class="row"><label><input type="checkbox" data-ra="${k}" ${((S.readAll||{})[k]===undefined?!['tamar','g8'].includes(K.track):(S.readAll||{})[k])?'checked':''}> להקריא כל שאלה (כבוי = רק בתחילת סוג שאלה חדש)</label></div>
  <div class="row">מטבעות: <button class="small-btn" data-c="${k}" data-v="10">+10</button><button class="small-btn" data-c="${k}" data-v="-10">−10</button> · לקבוע ל־<input id="cs_${k}" type="number" min="0" style="width:90px"> <button class="small-btn" data-cs="${k}">קבע</button></div>
  <table><tr><th>תאריך</th><th>שלב</th><th>ציון</th><th>עזרות</th></tr>${kd.log.slice(0,8).map(l=>`<tr><td>${l.d}</td><td>${SUBJECTS[l.s].title} · ${SUBJECTS[l.s].stages[l.i].t}</td><td>${l.score}%</td><td>${l.helps}</td></tr>`).join('')||'<tr><td colspan="4">עוד לא שיחקו</td></tr>'}</table>
  <div class="row"><button class="small-btn warn" data-rs="${k}">איפוס ההתקדמות של ${K.name}</button></div></div>`;}).join('')}
 <div class="card" style="text-align:right;margin-bottom:16px"><b style="font-size:24px">☁️ סנכרון בין מכשירים</b>
  ${SY.fam?`<div class="row">קוד המשפחה: <b dir="ltr" style="font-size:28px;letter-spacing:2px">${SY.fam}</b></div><div class="row note">כדי לחבר מכשיר נוסף: לפתוח בו את המשחק → אזור הורים → "הצטרפות עם קוד", ולהקליד את הקוד הזה.</div><div class="row" id="systat">${syStatus()}</div><div class="row"><button class="small-btn" id="synow">🔄 סנכרון עכשיו</button><button class="small-btn warn" id="syoff">ניתוק המכשיר מהסנכרון</button></div>`
  :`<div class="row note">המכשיר לא מסונכרן – ההתקדמות נשמרת רק בו.</div><div class="row"><button class="small-btn" id="synew">✨ יצירת קוד משפחה חדש</button></div><div class="row">יש לכם כבר קוד? <input id="syc" dir="ltr" placeholder="XXXX-XXXX-XXXX" style="width:220px;text-transform:uppercase"> <button class="small-btn" id="syjoin">הצטרפות עם קוד</button> <span id="syerr" class="note"></span></div>`}
 </div>
 <div class="card" style="text-align:right">

  <div class="row">מחירי החנות: <select id="px">${[4,6,10,15].map(x=>`<option value="${x}" ${((S.priceX||6)===x)?'selected':''}>${x===4?'זול':x===6?'רגיל':x===10?'יקר':'יקר מאוד'} (×${x})</option>`).join('')}</select> <span class="note">שלב שלם שווה עד 16 מטבעות. שלב שכבר קיבל 3 כוכבים לא נותן מטבעות.</span></div>
  <div class="row"><label><input type="checkbox" id="ua" ${S.unlockAll?'checked':''}> לפתוח את כל השלבים (בלי לעבור לפי הסדר)</label></div>
  <div class="row">🔊 הקול באפליקציה מוקלט מראש (קול Leda של Google), ולא תלוי בקול של המכשיר.</div>
  <div class="row">מהירות הדיבור: <input type="range" id="vr" min="0.75" max="1.15" step="0.05" value="${(S.voice&&S.voice.speed)||1}" style="width:200px"> <span id="vrv">${Math.round(((S.voice&&S.voice.speed)||1)*100)}%</span> <button class="small-btn" id="tv">🔊 בדיקה</button></div>
  <div class="row"><button class="small-btn" id="ex">⬇ גיבוי</button><label class="small-btn" style="cursor:pointer">⬆ שחזור<input type="file" id="im" accept=".json" hidden></label></div>
 </div></div>`;
 $('#back').onclick=home;
 if($('#synow'))$('#synow').onclick=()=>{SY.err='';$('#systat').innerHTML='⏳ מסנכרן…';syncNow();};
 if($('#syoff')){let armed=false;$('#syoff').onclick=()=>{if(!armed){armed=true;$('#syoff').textContent='לחצו שוב לאישור (ההתקדמות נשארת במכשיר)';return;}SY={};sySave();parent();};}
 if($('#synew'))$('#synew').onclick=()=>{SY.fam=newFamCode();SY.last=0;SY.err='';sySave();syStart();parent();};
 if($('#syjoin'))$('#syjoin').onclick=async()=>{$('#syerr').textContent='⏳ בודק…';const err=await joinFam($('#syc').value);if(err){$('#syerr').textContent='⚠ '+err;return;}syStart();parent();};
 app.querySelectorAll('[data-gs]').forEach(b=>b.onclick=()=>{const k=b.dataset.gs;const g=S.kids[k].goal;const nt=$('#gy_'+k).value;if(nt!==g.type){g.since=today();g.done=0;}g.type=nt;g.name=$('#gn_'+k).value||'פרס';g.target=Math.max(1,+$('#gt_'+k).value||7);g.min=Math.max(1,+$('#gm_'+k).value||3);save();parent();});
 app.querySelectorAll('[data-gr]').forEach(b=>b.onclick=()=>{const g=S.kids[b.dataset.gr].goal;g.done=0;g.since=today();save();parent();});
 app.querySelectorAll('[data-ek]').forEach(b=>b.onclick=()=>editKid(b.dataset.ek));
 app.querySelectorAll('[data-ra]').forEach(b=>b.onchange=()=>{S.readAll=S.readAll||{};S.readAll[b.dataset.ra]=b.checked;save();});
 app.querySelectorAll('[data-cs]').forEach(b=>b.onclick=()=>{const v=+$('#cs_'+b.dataset.cs).value;if(v>=0){S.kids[b.dataset.cs].coins=v;save();parent();}});
 app.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const kd=S.kids[b.dataset.c];kd.coins=Math.max(0,kd.coins+ +b.dataset.v);save();parent();});
 app.querySelectorAll('[data-rs]').forEach(b=>{let armed=false;b.onclick=()=>{if(!armed){armed=true;b.textContent='לחצו שוב לאישור האיפוס';return;}S.kids[b.dataset.rs]=defKid();save();parent();};});
 $('#chpin').onclick=()=>pinPad('🔑 הקלידו קוד חדש',a=>pinPad('🔑 הקלידו שוב לאישור',b=>{if(a===b){S.pin=a;save();toast('הקוד הוחלף ✔');parent();}else{toast('הקודים לא תואמים',true);}}));
 $('#ua').onchange=e=>{S.unlockAll=e.target.checked;save();};$('#px').onchange=e=>{S.priceX=+e.target.value;save();};
 const sv=()=>{S.voice=S.voice||{};S.voice.speed=+$('#vr').value;$('#vrv').textContent=Math.round(S.voice.speed*100)+'%';save();};
 $('#vr').oninput=sv;
 $('#tv').onclick=()=>{sv();Object.keys(VOICE_PARTS).forEach(loadVoice);speak(['שָׁלוֹם! כָּכָה נִשְׁמָע הַקּוֹל בְּעִבְרִית. בָּ, מָ, לָ.',{t:'And this is English. Cat, cake, tree.',l:'en'}]);};
 $('#ex').onclick=()=>{const t=JSON.stringify(S);try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'application/json'}));a.download='learning-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();}catch(e){}
  try{navigator.clipboard.writeText(t).then(()=>{$('#ex').textContent='✔ הגיבוי הועתק';},()=>{});}catch(e){}};
 $('#im').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(d&&d.kids){S=d;if(!S.profiles)S.profiles=[];buildKids();save();parent();}}catch(err){}});};
}
home();
</script>
